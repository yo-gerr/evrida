<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="application-name" content="Evrida" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2217%22 fill=%22%23496B50%22/%3E%3Cpath d=%22M18 17h28v7H26v6h17v7H26v6h20v7H18z%22 fill=%22white%22/%3E%3Ccircle cx=%2249%22 cy=%2214%22 r=%225%22 fill=%22%23D8B66A%22/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#F7F5EF" />
    <meta
      name="description"
      content="Evrida is your private, local-first space for habits, daily intentions, journaling, and gentle personal growth."
    />
    <title>Evrida — Every day, a little more you</title>
    <style>
      :root {
        color-scheme: light;

        /* Palette — warm ivory paper, forest green identity */
        --bg: #f7f5ef;
        --card: #ffffff;
        --soft: #eaede5;
        --ink: #25352b;
        --muted: #59665b;
        --line: #dcddd3;
        --accent: #496b50;
        --accentInk: #ffffff;
        --good: #356747;
        --sage: #c7d7c1;
        --terracotta: #c8795a;
        --gold: #d8b66a;
        --slate: #788a9a;
        --danger: #a4443a;
        --focus: #496b50;
        --progress-track: #c7d7c1;

        /* Typography — system sans for UI, Georgia for reflective content */
        --font-ui:
          system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-editorial: Georgia, 'Times New Roman', serif;
        --fs-xs: 0.75rem;
        --fs-sm: 0.8125rem;
        --fs-base: 0.9375rem;
        --fs-md: 1rem;
        --fs-lg: 1.125rem;
        --fs-xl: 1.375rem;
        --fs-page: clamp(1.625rem, 3.6vw, 2.125rem);
        --fs-quote: clamp(1.125rem, 2.4vw, 1.4375rem);
        --lh-body: 1.6;

        /* Spacing scale */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 20px;
        --sp-6: 24px;
        --sp-7: 32px;
        --sp-8: 40px;

        /* Shape */
        --bw: 1px;
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-pill: 999px;

        /* Elevation — surface contrast first, shadows only for real layers */
        --shadow-1: 0 1px 2px rgba(37, 53, 43, 0.06);
        --shadow-2: 0 12px 32px rgba(37, 53, 43, 0.1);
        --shadow-modal: 0 24px 64px rgba(23, 29, 25, 0.3);

        /* Motion */
        --dur-1: 120ms;
        --dur-2: 200ms;
        --ease: cubic-bezier(0.2, 0.6, 0.3, 1);

        /* Layout */
        --app-max: 1080px;
        --control-h: 42px;

        /* Per-habit color helpers — --hc is set inline on the component */
        --hcText: color-mix(in srgb, var(--hc, #496b50) 75%, #101712);
        --hcFill: var(--hc, #496b50);

        font-family: var(--font-ui);
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #171d19;
        --card: #232c25;
        --soft: #2b362d;
        --ink: #f0eee5;
        --muted: #b8c2b5;
        --line: #39463b;
        --accent: #a9c49f;
        --accentInk: #171d19;
        --good: #a9c49f;
        --sage: #3a4a3d;
        --terracotta: #de9b7e;
        --gold: #e0c283;
        --slate: #9db0bf;
        --danger: #e89484;
        --focus: #c1d5b8;
        --progress-track: #2f3b31;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-2: 0 12px 32px rgba(0, 0, 0, 0.45);
        --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.55);
        --hcText: color-mix(in srgb, var(--hc, #a9c49f) 55%, var(--ink));
        --hcFill: color-mix(in srgb, var(--hc, #a9c49f) 78%, var(--ink));
      }

      @media (prefers-color-scheme: dark) {
        :root[data-theme='system'] {
          color-scheme: dark;
          --bg: #171d19;
          --card: #232c25;
          --soft: #2b362d;
          --ink: #f0eee5;
          --muted: #b8c2b5;
          --line: #39463b;
          --accent: #a9c49f;
          --accentInk: #171d19;
          --good: #a9c49f;
          --sage: #3a4a3d;
          --terracotta: #de9b7e;
          --gold: #e0c283;
          --slate: #9db0bf;
          --danger: #e89484;
          --focus: #c1d5b8;
          --progress-track: #2f3b31;
          --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
          --shadow-2: 0 12px 32px rgba(0, 0, 0, 0.45);
          --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.55);
          --hcText: color-mix(in srgb, var(--hc, #a9c49f) 55%, var(--ink));
          --hcFill: color-mix(in srgb, var(--hc, #a9c49f) 78%, var(--ink));
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: var(--fs-base);
        line-height: var(--lh-body);
        transition:
          background var(--dur-2) var(--ease),
          color var(--dur-2) var(--ease);
      }

      ::selection {
        background: color-mix(in srgb, var(--sage) 75%, transparent);
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      input,
      select,
      textarea {
        font: inherit;
        font-family: var(--font-ui);
      }

      h1,
      h2,
      h3,
      h4 {
        line-height: 1.25;
      }

      p {
        margin: 0 0 var(--sp-3);
      }

      p:last-child {
        margin-bottom: 0;
      }

      /* ---------- Layout ---------- */

      .app {
        max-width: var(--app-max);
        margin: 0 auto;
        padding: var(--sp-5) var(--sp-6) var(--sp-8);
      }

      header {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        flex-wrap: wrap;
        row-gap: var(--sp-3);
        padding-bottom: var(--sp-5);
      }

      .brand {
        flex: 1;
        min-width: 0;
      }

      .logo {
        width: 42px;
        height: 42px;
        border-radius: var(--r-md);
        background: var(--accent);
        color: var(--accentInk);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 19px;
        letter-spacing: -1.5px;
        float: left;
        margin-right: var(--sp-3);
        user-select: none;
      }

      .brand h1 {
        font-family: var(--font-editorial);
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0;
        margin: 0 0 1px;
        line-height: 1.2;
      }

      .brand p {
        color: var(--muted);
        font-size: var(--fs-xs);
        margin: 0;
      }

      /* ---------- Top navigation — quiet editorial tabs ---------- */

      .nav {
        display: flex;
        gap: 2px;
        border-bottom: var(--bw) solid var(--line);
        margin-bottom: var(--sp-7);
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .nav button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        padding: 9px 14px 11px;
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        border-radius: var(--r-sm) var(--r-sm) 0 0;
        transition:
          color var(--dur-1) var(--ease),
          background var(--dur-1) var(--ease);
      }

      .nav button span {
        font-size: 15px;
      }

      .nav button:hover {
        color: var(--ink);
        background: var(--soft);
      }

      .nav button.active {
        color: var(--ink);
        font-weight: 650;
        background: transparent;
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      /* ---------- Page headings ---------- */

      .page-head {
        display: flex;
        align-items: center;
        gap: var(--sp-4);
        flex-wrap: wrap;
        margin-bottom: var(--sp-6);
      }

      .page-head > div {
        flex: 1;
        min-width: 240px;
      }

      .eyebrow {
        font-family: var(--font-editorial);
        font-style: italic;
        font-size: 14.5px;
        color: var(--accent);
        margin: 0 0 var(--sp-1);
      }

      .page-head h2 {
        font-family: var(--font-editorial);
        font-size: var(--fs-page);
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.18;
        margin: 0 0 var(--sp-1);
      }

      .page-head > .btn {
        flex: none;
      }

      /* ---------- Progress summary strip — one surface, not three cards ---------- */

      .stats {
        display: flex;
        background: var(--card);
        border: var(--bw) solid var(--line);
        border-radius: var(--r-lg);
        margin-bottom: var(--sp-6);
        overflow: hidden;
      }

      .stat {
        flex: 1;
        min-width: 0;
        padding: var(--sp-4) var(--sp-5);
        border-left: var(--bw) solid var(--line);
      }

      .stat:first-child {
        border-left: 0;
      }

      .stat strong {
        display: block;
        font-size: 26px;
        font-weight: 750;
        line-height: 1.15;
        margin-bottom: 2px;
        font-variant-numeric: tabular-nums;
      }

      .stat span {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.35;
        display: block;
      }

      /* ---------- Section structure ---------- */

      .section-title {
        display: flex;
        align-items: baseline;
        gap: var(--sp-3);
        margin: var(--sp-6) 0 var(--sp-3);
        border-bottom: var(--bw) solid var(--line);
        padding-bottom: var(--sp-2);
      }

      .section-title h3 {
        font-size: 15.5px;
        font-weight: 700;
        margin: 0;
      }

      .section-title span {
        color: var(--muted);
        font-size: 12.5px;
      }

      .category-heading {
        display: flex;
        align-items: baseline;
        gap: var(--sp-2);
        margin: var(--sp-7) 0 var(--sp-3);
        font-family: var(--font-editorial);
        font-size: 17px;
        font-weight: 700;
      }

      .category-heading h3 {
        font-size: inherit;
        font-weight: inherit;
        margin: 0;
      }

      .category-heading span {
        color: var(--muted);
        font-size: 12.5px;
        font-family: var(--font-ui);
        font-weight: 500;
      }

      .panel {
        background: var(--card);
        border: var(--bw) solid var(--line);
        border-radius: var(--r-lg);
        padding: 18px;
        margin-bottom: 14px;
        box-shadow: var(--shadow-1);
      }

      .panel h3 {
        margin: 0 0 var(--sp-3);
        font-size: 15.5px;
        font-weight: 700;
      }

      /* ---------- Tinted note — reflective content without a card shell ---------- */

      .note {
        background: color-mix(in srgb, var(--sage) 34%, var(--card));
        border: var(--bw) solid color-mix(in srgb, var(--sage) 60%, var(--line));
        border-radius: var(--r-md);
        padding: var(--sp-4) 18px;
        margin: var(--sp-5) 0;
      }

      .note,
      .insight-note {
        color: var(--ink);
      }

      .note h3 {
        font-family: var(--font-editorial);
        font-size: 17px;
        font-weight: 700;
        margin: 0 0 var(--sp-2);
      }

      .note p {
        margin: 6px 0;
      }

      /* ---------- Buttons ---------- */

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: var(--control-h);
        padding: 9px 16px;
        border: var(--bw) solid var(--line);
        border-radius: var(--r-sm);
        background: var(--card);
        color: var(--ink);
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
        transition:
          background var(--dur-1) var(--ease),
          border-color var(--dur-1) var(--ease),
          color var(--dur-1) var(--ease);
      }

      .btn:hover {
        background: var(--soft);
        border-color: color-mix(in srgb, var(--ink) 25%, var(--line));
      }

      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accentInk);
      }

      .btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 86%, #000);
        border-color: color-mix(in srgb, var(--accent) 86%, #000);
      }

      .btn.danger {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
      }

      .btn.danger:hover {
        background: color-mix(in srgb, var(--danger) 10%, var(--card));
      }

      .btn.small {
        min-height: 34px;
        padding: 5px 11px;
        font-size: 13px;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        padding: 0;
        border: var(--bw) solid var(--line);
        border-radius: var(--r-sm);
        background: var(--card);
        color: var(--ink);
        font-size: 17px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background var(--dur-1) var(--ease);
      }

      .icon-btn:hover {
        background: var(--soft);
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2);
        align-items: center;
        margin-top: var(--sp-3);
      }

      .card-actions button {
        border: var(--bw) solid var(--line);
        background: var(--card);
        color: var(--muted);
        border-radius: var(--r-sm);
        padding: 7px 11px;
        font-size: 13px;
        font-weight: 600;
        transition:
          background var(--dur-1) var(--ease),
          color var(--dur-1) var(--ease);
      }

      .card-actions button:hover {
        background: var(--soft);
        color: var(--ink);
      }

      /* ---------- Habit cards ---------- */

      .habit-list {
        display: grid;
        gap: var(--sp-3);
      }

      .habit-card {
        background: var(--card);
        border: var(--bw) solid var(--line);
        border-radius: var(--r-lg);
        padding: var(--sp-4) 18px;
        box-shadow: var(--shadow-1);
      }

      .habit-top {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
      }

      .habit-icon {
        width: 42px;
        height: 42px;
        flex: none;
        border-radius: var(--r-md);
        background: color-mix(in srgb, var(--hc) 14%, var(--card));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }

      .habit-info {
        flex: 1;
        min-width: 0;
      }

      .habit-info h3 {
        margin: 0 0 2px;
        font-size: 15.5px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .habit-info p {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 12.5px;
      }

      .category-tag {
        display: inline-block;
        background: var(--soft);
        color: var(--muted);
        border-radius: var(--r-pill);
        padding: 2px 9px;
        font-size: 11.5px;
        font-weight: 600;
      }

      .complete {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 50%;
        border: 2px solid var(--hcText);
        background: transparent;
        color: var(--hcText);
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition:
          background var(--dur-2) var(--ease),
          border-color var(--dur-2) var(--ease),
          color var(--dur-2) var(--ease);
      }

      .complete:hover {
        background: color-mix(in srgb, var(--hc) 8%, transparent);
      }

      .complete.partial {
        background: color-mix(in srgb, var(--hc) 18%, var(--card));
        color: var(--ink);
        font-size: 16px;
        font-weight: 800;
      }

      .complete.done {
        background: var(--hcFill);
        border-color: var(--hcFill);
        color: var(--accentInk);
      }

      .progress-row {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        margin-top: var(--sp-3);
      }

      .track {
        flex: 1;
        height: 9px;
        background: var(--progress-track);
        border-radius: var(--r-pill);
        overflow: hidden;
      }

      .track span {
        display: block;
        height: 100%;
        background: var(--hcFill);
        border-radius: var(--r-pill);
        transition: width var(--dur-2) var(--ease);
      }

      .progress-label {
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
      }

      /* ---------- Habit grid / history heatmap ---------- */

      .habit-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
        margin-top: var(--sp-3);
        max-width: 440px;
      }

      .grid-spacer {
        aspect-ratio: 1;
        min-width: 0;
      }

      .day-cell {
        aspect-ratio: 1;
        border: 0;
        border-radius: 5px;
        background: var(--soft);
        min-width: 0;
        padding: 0;
        position: relative;
      }

      .day-cell.full,
      .art span.full {
        background: var(--hcFill);
      }

      .day-cell.partial,
      .art span.partial {
        background: color-mix(in srgb, var(--hc) 45%, var(--soft));
      }

      .day-cell.unscheduled,
      .art span.unscheduled {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .day-cell.future,
      .art span.future {
        opacity: 0.45;
      }

      .day-cell.pre,
      .art span.pre {
        background: transparent;
      }

      .day-cell.today {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .day-cell:focus-visible {
        z-index: 2;
      }

      button.day-cell:not(.unscheduled):not(.future):hover {
        box-shadow: inset 0 0 0 2px
          color-mix(in srgb, var(--ink) 40%, transparent);
      }

      /* ---------- Legends ---------- */

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 7px 14px;
        color: var(--muted);
        font-size: 12.5px;
        margin-top: var(--sp-3);
      }

      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        background: var(--soft);
        display: inline-block;
        flex: none;
        font-style: normal;
      }

      .dot.full {
        background: var(--good);
      }

      .dot.partial {
        background: color-mix(in srgb, var(--good) 45%, var(--soft));
      }

      .dot.hollow {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--line);
      }

      .dot.faint {
        background: var(--soft);
        opacity: 0.45;
      }

      .dot.pre {
        background: transparent;
        border: 1px dashed var(--line);
      }

      .dot.outlined {
        background: var(--soft);
        outline: 2px solid var(--ink);
        outline-offset: 1px;
      }

      /* ---------- Empty states ---------- */

      .empty {
        border: 1.5px dashed var(--line);
        border-radius: var(--r-lg);
        background: color-mix(in srgb, var(--soft) 45%, transparent);
        padding: var(--sp-8) var(--sp-5);
        text-align: center;
        margin-bottom: var(--sp-5);
      }

      .empty .emoji {
        font-size: 30px;
        display: block;
        margin-bottom: var(--sp-3);
      }

      .empty h3 {
        font-family: var(--font-editorial);
        font-size: 19px;
        font-weight: 700;
        margin: 0 0 var(--sp-2);
      }

      .empty p {
        color: var(--muted);
        max-width: 46ch;
        margin: 0 auto var(--sp-4);
      }

      /* ---------- Quote — editorial, on the page background ---------- */

      .quote-card {
        background: transparent;
        border: 0;
        border-top: var(--bw) solid var(--line);
        box-shadow: none;
        padding: var(--sp-5) 0 0;
        margin: var(--sp-6) 0 0;
      }

      .quote-text {
        font-family: var(--font-editorial);
        font-style: italic;
        font-size: var(--fs-quote);
        line-height: 1.5;
        color: var(--ink);
        max-width: 30em;
        margin: 0 0 var(--sp-3);
      }

      .quote-author {
        color: var(--muted);
        font-size: 13px;
      }

      .quote-card .card-actions {
        margin-top: var(--sp-4);
      }

      /* ---------- Daily intentions (tasks) ---------- */

      .panel.intentions {
        margin-top: var(--sp-6);
      }

      .task-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .task-row {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        padding: 9px 0;
        border-bottom: var(--bw) solid var(--line);
      }

      .task-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .task-row input[type='checkbox'] {
        width: 19px;
        height: 19px;
        accent-color: var(--accent);
        flex: none;
      }

      .task-row .task-label {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .task-row.done .task-label {
        text-decoration: line-through;
        color: var(--muted);
      }

      .task-row button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 18px;
        padding: 4px 7px;
        border-radius: var(--r-sm);
      }

      .task-row button:hover {
        background: var(--soft);
        color: var(--ink);
      }

      .task-add {
        display: flex;
        gap: var(--sp-2);
        margin-top: var(--sp-3);
      }

      .task-add input {
        flex: 1;
        min-width: 0;
      }

      .task-progress {
        font-size: 12.5px;
        color: var(--muted);
      }

      /* ---------- Insights ---------- */

      .insight-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-3);
        align-items: flex-end;
        margin-bottom: var(--sp-5);
      }

      .insight-controls .field {
        margin-bottom: 0;
      }

      .bar-row {
        display: grid;
        grid-template-columns: minmax(90px, 1fr) minmax(120px, 2.2fr) 48px;
        gap: var(--sp-3);
        align-items: center;
        padding: 9px 0;
        border-bottom: var(--bw) solid var(--line);
        font-size: 13.5px;
      }

      .bar-row:last-child {
        border-bottom: 0;
      }

      .bar-row > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .bar-track {
        height: 10px;
        background: var(--progress-track);
        border-radius: var(--r-pill);
        overflow: hidden;
      }

      .bar-track span {
        display: block;
        height: 100%;
        background: var(--good);
        border-radius: var(--r-pill);
        transition: width var(--dur-2) var(--ease);
      }

      .bar-row strong {
        text-align: right;
        font-size: 13.5px;
      }

      .habit-insight {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        padding: var(--sp-3) 0;
        border-bottom: var(--bw) solid var(--line);
      }

      .habit-insight:last-child {
        border-bottom: 0;
      }

      .habit-insight > div:nth-child(2) {
        flex: 1;
        min-width: 0;
      }

      .habit-insight h4 {
        margin: 0 0 2px;
        font-size: 14.5px;
        font-weight: 700;
      }

      .habit-insight p {
        margin: 0;
        color: var(--muted);
        font-size: 12.5px;
      }

      .habit-insight > strong {
        font-size: 13.5px;
      }

      .insight-note {
        background: color-mix(in srgb, var(--sage) 34%, var(--card));
        border: var(--bw) solid color-mix(in srgb, var(--sage) 60%, var(--line));
        border-radius: var(--r-md);
        padding: var(--sp-4) 18px;
        margin: var(--sp-5) 0;
      }

      .insight-note strong {
        font-weight: 700;
      }

      /* ---------- Journal ---------- */

      .journal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--sp-4);
        align-items: start;
      }

      .journal-entry {
        background: var(--soft);
        border-radius: var(--r-md);
        padding: var(--sp-4);
        margin-bottom: var(--sp-3);
      }

      .journal-entry > .btn {
        margin-bottom: var(--sp-2);
      }

      .journal-entry p {
        line-height: 1.65;
        max-width: 72ch;
        overflow-wrap: anywhere;
      }

      .journal-editor .field label {
        font-family: var(--font-editorial);
        font-size: 15.5px;
        font-weight: 600;
        color: var(--ink);
        display: block;
        margin-bottom: 6px;
      }

      .journal-editor textarea {
        line-height: 1.65;
        max-width: 76ch;
      }

      .journal-editor .task-progress {
        margin-top: 6px;
      }

      .mood-pick {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2);
      }

      .mood-pick button {
        border: var(--bw) solid var(--line);
        background: var(--card);
        border-radius: var(--r-pill);
        padding: 8px 13px;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 40px;
        transition:
          background var(--dur-1) var(--ease),
          border-color var(--dur-1) var(--ease);
      }

      .mood-pick button:hover {
        background: var(--soft);
      }

      .mood-pick button.selected {
        background: color-mix(in srgb, var(--terracotta) 18%, var(--card));
        border-color: var(--terracotta);
        color: var(--ink);
        font-weight: 650;
      }

      /* ---------- Gallery ---------- */

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: var(--sp-4);
      }

      .art-card {
        background: var(--card);
        border: var(--bw) solid var(--line);
        border-radius: var(--r-lg);
        padding: 14px;
        box-shadow: var(--shadow-1);
      }

      .art-card h4 {
        margin: 0 0 2px;
        font-size: 14.5px;
        font-weight: 700;
      }

      .art-card p {
        color: var(--muted);
        font-size: 12.5px;
        margin: 0 0 var(--sp-3);
      }

      .art {
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        gap: 3px;
      }

      .art span {
        aspect-ratio: 1;
        border-radius: 2px;
        background: var(--soft);
      }

      /* ---------- Settings ---------- */

      .setting-row {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        padding: var(--sp-3) 0;
        border-bottom: var(--bw) solid var(--line);
      }

      .setting-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .setting-copy {
        flex: 1;
        min-width: 0;
      }

      .setting-copy h4 {
        margin: 0 0 2px;
        font-size: 14.5px;
        font-weight: 700;
      }

      .setting-copy p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin: 0;
      }

      .setting-row.danger-zone {
        border-top: 1.5px dashed
          color-mix(in srgb, var(--danger) 40%, var(--line));
        border-bottom: 0;
        margin-top: var(--sp-3);
        padding-top: var(--sp-4);
      }

      .privacy-note {
        background: color-mix(in srgb, var(--gold) 14%, var(--card));
        border: var(--bw) solid color-mix(in srgb, var(--gold) 40%, var(--line));
        border-radius: var(--r-md);
        padding: var(--sp-3) 14px;
        font-size: 13.5px;
        line-height: 1.55;
      }

      .privacy-note strong {
        font-weight: 700;
      }

      /* ---------- Forms and fields ---------- */

      .field {
        margin-bottom: var(--sp-4);
      }

      .field:last-child {
        margin-bottom: 0;
      }

      .field label {
        display: block;
        font-size: 13.5px;
        font-weight: 650;
        margin-bottom: 6px;
        color: var(--ink);
      }

      input[type='text'],
      input[type='date'],
      input[type='search'],
      select,
      textarea {
        width: 100%;
        min-height: var(--control-h);
        background: var(--card);
        border: var(--bw) solid var(--line);
        border-radius: var(--r-sm);
        color: var(--ink);
        padding: 10px 12px;
        font-size: 14.5px;
        transition: border-color var(--dur-1) var(--ease);
      }

      textarea {
        min-height: 100px;
        resize: vertical;
        line-height: 1.6;
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
      }

      input:hover,
      select:hover,
      textarea:hover {
        border-color: color-mix(in srgb, var(--ink) 25%, var(--line));
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
      }

      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--sp-3);
      }

      .weekday-pick,
      .emoji-pick,
      .color-pick {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .weekday-pick button {
        width: 40px;
        height: 40px;
        border: var(--bw) solid var(--line);
        background: var(--card);
        border-radius: var(--r-sm);
        font-size: 13.5px;
        font-weight: 700;
        padding: 0;
        transition:
          background var(--dur-1) var(--ease),
          border-color var(--dur-1) var(--ease);
      }

      .weekday-pick button:hover {
        background: var(--soft);
      }

      .weekday-pick button.selected {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accentInk);
      }

      .emoji-pick button {
        width: 40px;
        height: 40px;
        border: var(--bw) solid transparent;
        background: var(--soft);
        border-radius: var(--r-sm);
        font-size: 19px;
        padding: 0;
        line-height: 1;
      }

      .emoji-pick button:hover {
        background: color-mix(in srgb, var(--sage) 60%, var(--card));
      }

      .emoji-pick button.selected {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--sage) 60%, var(--card));
      }

      .color-pick button {
        width: 32px;
        height: 32px;
        border: 2px solid transparent;
        border-radius: 50%;
        padding: 0;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
        transition: transform var(--dur-1) var(--ease);
      }

      .color-pick button:hover {
        transform: scale(1.08);
      }

      .color-pick button.selected {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- Dialogs ---------- */

      .modal {
        width: min(94vw, 520px);
        background: var(--card);
        color: var(--ink);
        border: var(--bw) solid var(--line);
        border-radius: var(--r-lg);
        padding: var(--sp-6);
        box-shadow: var(--shadow-modal);
        max-height: 92vh;
        overflow-y: auto;
      }

      .modal::backdrop {
        background: rgba(23, 29, 25, 0.45);
      }

      .modal h2 {
        font-family: var(--font-editorial);
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 var(--sp-5);
      }

      .modal-footer {
        display: flex;
        gap: var(--sp-2);
        align-items: center;
        flex-wrap: wrap;
        margin-top: var(--sp-5);
      }

      .grow {
        flex: 1;
      }

      /* ---------- Toast ---------- */

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(20px);
        background: var(--ink);
        color: var(--bg);
        border-radius: var(--r-md);
        padding: 12px 16px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--dur-2) var(--ease),
          transform var(--dur-2) var(--ease);
        z-index: 50;
        max-width: min(92vw, 480px);
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        pointer-events: auto;
      }

      .toast button {
        background: transparent;
        border: 0;
        color: inherit;
        text-decoration: underline;
        font-weight: 700;
        font-size: 14px;
        padding: 4px;
      }

      /* ---------- Utilities ---------- */

      .muted {
        color: var(--muted);
      }

      .small-text {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.55;
      }

      .hidden {
        display: none !important;
      }

      .spacer {
        flex: 1;
      }

      .header-export {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      /* ---------- Bottom navigation (mobile) ---------- */

      .bottom-nav {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--card);
        border-top: var(--bw) solid var(--line);
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        z-index: 40;
      }

      .bottom-nav button {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--muted);
        border-radius: var(--r-sm);
        padding: 7px 4px;
        font-size: 11.5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        min-height: 50px;
        justify-content: center;
        transition: background var(--dur-1) var(--ease);
      }

      .bottom-nav button span {
        font-size: 19px;
        line-height: 1;
      }

      .bottom-nav button:hover {
        background: var(--soft);
      }

      .bottom-nav button.active {
        background: var(--soft);
        color: var(--ink);
        font-weight: 700;
      }

      /* ---------- Responsive ---------- */

      @media (max-width: 650px) {
        .app {
          padding: var(--sp-4) var(--sp-4) 92px;
        }

        header {
          padding-bottom: var(--sp-4);
        }

        .nav {
          display: none;
        }

        .bottom-nav {
          display: flex;
        }

        .page-head {
          margin-bottom: var(--sp-5);
        }

        .page-head > .btn {
          width: 100%;
        }

        .stats {
          margin-bottom: var(--sp-5);
        }

        .stat {
          padding: var(--sp-3) var(--sp-3);
        }

        .stat strong {
          font-size: 22px;
        }

        .btn {
          min-height: 44px;
        }

        .icon-btn {
          width: 44px;
          height: 44px;
        }

        .card-actions button {
          padding: 9px 12px;
          min-height: 42px;
        }

        .two {
          grid-template-columns: 1fr;
        }

        .journal-grid {
          grid-template-columns: 1fr;
        }

        .bar-row {
          grid-template-columns: minmax(80px, 1fr) minmax(80px, 1.6fr) 44px;
          gap: var(--sp-2);
        }

        .habit-card {
          padding: var(--sp-4);
        }

        .complete {
          width: 46px;
          height: 46px;
        }

        .weekday-pick button {
          width: 44px;
          height: 44px;
        }

        .emoji-pick button {
          width: 44px;
          height: 44px;
        }

        .color-pick button {
          width: 36px;
          height: 36px;
        }

        .task-row button {
          padding: 8px 10px;
        }

        .modal {
          padding: var(--sp-5) var(--sp-4);
        }

        .toast {
          bottom: calc(78px + env(safe-area-inset-bottom));
        }

        .modal-footer .btn {
          flex: 1;
        }

        .modal-footer .grow {
          display: none;
        }

        .setting-row {
          flex-wrap: wrap;
        }

        .gallery-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">
          <div class="logo" aria-hidden="true">
            e<span style="color: #d8b66a">·</span>
          </div>
          <div>
            <h1>Evrida</h1>
            <p>Every day, a little more you.</p>
          </div>
        </div>
        <button
          class="icon-btn"
          id="headerTheme"
          aria-label="Change appearance"
          title="Change appearance"

        ><button class="btn header-export" id="headerExport">Export</button
        ><button class="btn primary" id="headerAdd">＋ New habit</button>
      </header>
      <nav class="nav" id="topNav" aria-label="Main navigation"></nav>
      <main id="main" tabindex="-1"></main>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
    <input type="file" id="backupFile" accept="application/json,.json" hidden />
    <dialog class="modal" id="habitDialog">
      <form id="habitForm">
        <h2 id="dialogTitle">Create a habit</h2>
        <p class="muted small-text">Make it specific, achievable, and yours.</p>
        <div class="field">
          <label for="habitName">Habit name</label
          ><input
            id="habitName"
            type="text"
            maxlength="60"
            placeholder="e.g. Read 10 pages"
            required
          />
        </div>
        <div class="field">
          <label>Icon</label>
          <div class="emoji-pick" id="emojiPick"></div>
        </div>
        <div class="two">
          <div class="field">
            <label for="habitGoal">Daily target</label
            ><input
              id="habitGoal"
              type="number"
              min="1"
              max="99"
              value="1"
              required
            />
          </div>
          <div class="field">
            <label for="habitStart">Start date</label
            ><input id="habitStart" type="date" required />
          </div>
        </div>
        <div class="field">
          <label for="habitCategory">Category</label
          ><select id="habitCategory">
            <option>Health &amp; Fitness</option>
            <option>Learning</option>
            <option>Productivity</option>
            <option>Mindfulness</option>
            <option>Home</option>
            <option>Relationships</option>
            <option>Finance</option>
            <option selected>General</option>
            <option value="__custom__">＋ Custom category…</option>
          </select>
        </div>
        <div class="field hidden" id="customCategoryWrap">
          <label for="customCategory">Custom category name</label
          ><input
            id="customCategory"
            type="text"
            maxlength="32"
            placeholder="e.g. Creative hobbies"
          />
        </div>
        <div class="field">
          <label>Color</label>
          <div class="color-pick" id="colorPick"></div>
        </div>
        <div class="field">
          <label>Scheduled days</label>
          <div class="weekday-pick" id="weekdayPick"></div>
          <p class="small-text">
            Choose the days this habit is expected. Select all seven for every
            day.
          </p>
        </div>
        <div class="modal-footer">
          <button class="btn danger" type="button" id="deleteHabit" hidden>
            Delete</button
          ><span class="grow"></span
          ><button class="btn" type="button" id="cancelHabit">Cancel</button
          ><button class="btn primary" type="submit">Save habit</button>
        </div>
      </form>
    </dialog>
    <dialog class="modal" id="confirmDialog">
      <h2 id="confirmTitle">Are you sure?</h2>
      <p id="confirmText" class="muted"></p>
      <div class="modal-footer">
        <span class="grow"></span
        ><button class="btn" id="confirmCancel">Cancel</button
        ><button class="btn primary" id="confirmOk">Continue</button>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span id="toastText"></span><button id="undoBtn">Undo</button>
    </div>
    <script>

          else h.done[k] = Math.min(999, next);
          save();
          render();
          snapshotUndo(`${h.name}: ${Math.max(0, next)} recorded.`, () => {
            if (prev) h.done[k] = prev;
            else delete h.done[k];
          });
        }
        async function exportData() {
          const data = JSON.stringify(
            { ...state, app: 'Evrida', exportedAt: new Date().toISOString() },
            null,
            2
          );
          const blob = new Blob([data], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `evrida-backup-${today()}.json`;
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          notify('Backup exported. Keep it somewhere safe.', false);
        }
        function importData() {
          const f = $('#backupFile');
          f.value = '';
          f.click();
        }
        $('#backupFile').onchange = async e => {
          const file = e.target.files?.[0];
          if (!file) return;
          if (file.size > 5 * 1024 * 1024) {
            notify('Backup is too large (maximum 5 MB).', false);
            return;
          }
          try {
            const parsed = JSON.parse(await file.text());
            const candidate = normalize(parsed);
            const ok = await openConfirm(
              'Replace local data?',
              `This backup contains ${candidate.habits.length} habit(s). Importing replaces your current habits and history. A safety copy of the current data will be downloaded first.`,
              'Import backup'
            );
            if (!ok) return;
            await exportData();
            state = candidate;
            save();
            render();
            notify('Backup imported successfully.', false);
          } catch (err) {
            notify(
              `Import failed: ${err.message || 'Invalid backup file.'}`,
              false
            );
          }
        };
        async function handleAction(e) {
          const b = e.currentTarget,
            action = b.dataset.action,
            id = b.dataset.id,
            h = state.habits.find(x => x.id === id);
          if (action === 'task-toggle') {
            const list = state.tasks?.[today()] || [],
              task = list.find(t => t.id === id);
            if (task) {
              task.done = b.checked;
              save();
              render();
            }
            return;
          }
          if (action === 'task-delete') {
            const list = state.tasks?.[today()] || [],
              idx = list.findIndex(t => t.id === id);
            if (idx >= 0) {
              const removed = list.splice(idx, 1)[0];
              if (!list.length) delete state.tasks[today()];
              save();
              render();
              snapshotUndo('Intention removed.', () => {
                state.tasks = state.tasks || {};
                state.tasks[today()] = state.tasks[today()] || [];
                state.tasks[today()].splice(
                  Math.min(idx, state.tasks[today()].length),
                  0,
                  removed
                );
              });
            }
            return;
          }
          if (action === 'task-carry') {
            const old = carryPending();
            if (!old.length) {
              notify(
                "Yesterday's unfinished intentions are already here.",
                false
              );
              return;
            }
            state.tasks = state.tasks || {};
            state.tasks[today()] = state.tasks[today()] || [];
            const room = Math.max(0, 100 - state.tasks[today()].length);
            const copies = old.slice(0, room).map(t => ({
              id: `t${Date.now()}${Math.random().toString(36).slice(2, 7)}`,
              text: t.text,
              done: false
            }));
            state.tasks[today()].push(...copies);
            save();
            render();
            notify(
              copies.length
                ? `${copies.length} intention${copies.length === 1 ? '' : 's'} brought forward.`
                : 'Today already has the maximum number of intentions.',
              false
            );
            return;
          }
          if (action === 'save-quote') {
            const i = Number(b.dataset.quote);
            if (!Number.isInteger(i) || !QUOTES[i]) return;
            state.savedQuotes = state.savedQuotes || [];
            const wasSaved = state.savedQuotes.includes(i);
            state.savedQuotes = wasSaved
              ? state.savedQuotes.filter(x => x !== i)
              : [...state.savedQuotes, i];
            save();
            render();
            notify(
              wasSaved ? 'Quote removed from saved quotes.' : 'Quote saved.',
              false
            );
            return;
          }
          if (action === 'save-journal') {
            const entry = {
              note: $('#journalNote').value.trim(),
              wentWell: $('#journalWell').value.trim(),
              challenge: $('#journalChallenge').value.trim(),
              grateful: $('#journalGrateful').value.trim(),
              mood:
                document.querySelector('[data-mood].selected')?.dataset.mood ||
                ''
            };
            if (Object.values(entry).some(v => String(v).trim()))
              state.journal[journalDate] = entry;
            else delete state.journal[journalDate];
            save();
            render();
            notify('Journal entry saved on this device.', false);
            return;
          }
          if (action === 'clear-journal') {
            if (!state.journal[journalDate]) {
              notify('There is no saved entry for this date.', false);
              return;
            }
            const ok = await openConfirm(
              'Clear this journal entry?',
              `The entry for ${fmt(journalDate)} will be removed from this browser.`,
              'Clear entry'
            );
            if (ok) {
              delete state.journal[journalDate];
              save();
              render();
              notify('Journal entry cleared.', false);
            }
            return;
          }
          if (action === 'open-journal') {
            journalDate = b.dataset.date;
            render();
            return;
          }
          if (action === 'new') return openHabit();
          if (action === 'edit' && h) return openHabit(id);
          if (action === 'export') return exportData();
          if (action === 'import') return importData();
          if (action === 'clear') {
            const ok = await openConfirm(
              'Delete all local data?',
              `This permanently removes ${state.habits.length} habit(s), all history, journal entries, saved quotes, daily intentions, and gallery data from this browser. Export a backup first if you may want it later.`,
              'Delete everything'
            );
            if (ok) {
              const old = state;
              state = defaultState();
              save();
              render();
              snapshotUndo('Local data deleted.', () => {
                state = old;
              });
            }
            return;
          }
          if (action === 'toggle' && h) {
            changeCount(h, today(), completed(h, today()) ? 0 : goal(h));
            return;
          }
          if (action === 'plus' && h) {
            changeCount(h, today(), count(h, today()) + 1);
            return;
          }
          if (action === 'minus' && h) {
            changeCount(h, today(), count(h, today()) - 1);
            return;
          }
          if (action === 'history' && h) {
            activePage = 'history';
            render();
            return;
          }
          if (action === 'day' && h) {
            const k = b.dataset.date;
            if (k > today()) return;
            const prev = count(h, k);
            const next = completed(h, k) ? 0 : goal(h);
            changeCount(h, k, next);
            return;
          }
        }
        $('#headerAdd').onclick = () => openHabit();
        $('#headerExport').onclick = exportData;
        $('#headerTheme').onclick = () => {
          const order = ['system', 'light', 'dark'];
          state.settings.theme =
            order[(order.indexOf(state.settings.theme) + 1) % order.length];
          save();
          render();
          notify(`Theme: ${state.settings.theme}.`, false);
        };
        window.addEventListener('storage', e => {
          if (e.key === KEY && e.newValue) {
            try {
              state = normalize(JSON.parse(e.newValue));
              render();
            } catch (_) {}
          }
        });
        load();
        applyTheme();
        render();
      })();
    </script>
  </body>
</html>
